[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-false-alarm-atlas"
version = "0.1.0"
description = "Meta-Band and Meta-TTT research code for CHB-MIT and TUSZ"
requires-python = ">=3.11,<3.12"
dependencies = [
  "einops",
  "mne",
  "numpy",
  "omegaconf",
  "pandas",
  "pyarrow",
  "pydantic>=2",
  "pyyaml",
  "scikit-learn",
  "scipy",
  "torch",
  "tqdm",
  "psutil",
]

[project.optional-dependencies]
test = ["pytest"]
legacy = ["matplotlib", "h5py", "lmdb", "pyEDFlib", "torchinfo", "ptflops", "catboost", "torch-geometric", "torchaudio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
